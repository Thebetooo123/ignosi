<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Contacto | Ignosi</title>
  <link href="../css/fonts.css" rel="stylesheet">
  <link href="../css/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
</head>
<body class="ig-page-bg-diagram">

  <div id="site-header"></div>

  <section class="bg-transparent">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 p-4 p-md-5 rounded-4 shadow-lg text-dark" style="background-color:var(--ig-cream);">
          <h1 class="display-5 text-dark ig-border-gold border-start border-4 ps-3 mb-4">Contáctanos</h1>
          <p class="text-muted mb-5">
            Nuestro equipo de soporte técnico especializado está listo para asesorarle en su próximo proyecto de infraestructura tecnológica.
          </p>
          <h3 class="text-center text-dark mb-4">Envíanos un Mensaje</h3>
          <form>
            <input class="form-control form-control-lg border-light shadow-sm mb-4" placeholder="Nombre" type="text" required>
            <input class="form-control form-control-lg border-light shadow-sm mb-4" placeholder="Email" type="email" required>
            <textarea class="form-control form-control-lg border-light shadow-sm mb-4" placeholder="Mensaje" rows="6" required></textarea>
            <button class="btn btn-warning ig-btn-gold w-100 btn-lg rounded-pill fw-bold shadow mt-4" type="submit">ENVIAR</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="../js/vendor/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
